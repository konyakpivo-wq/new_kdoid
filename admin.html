<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ — New KDroid</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">NEW KDROID</a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="repos.html">Репозитории</a>
    <a class="active" href="admin.html">Админ</a>
  </nav>
</header>

<main class="page narrow">

<section class="admin-card">

  <div class="badge">ADMIN</div>

  <h1>Административный режим</h1>

  <p id="status">
    Проверяем авторизацию...
  </p>

  <div id="loginArea" style="display:none">
    <button class="button primary" id="githubLogin">
      Войти через GitHub
    </button>
  </div>

  <div id="accountArea" style="display:none">

    <p>
      Вы вошли как:
      <strong id="githubUser"></strong>
    </p>

    <a class="button primary" href="admin-panel.html">
      Открыть админ-панель
    </a>

    <button class="button" id="logout">
      Выйти
    </button>

  </div>

  <div id="message" class="message"></div>

</section>

</main>

<footer>New KDroid</footer>

<script>

const WORKER_URL =
  "https://new-kdoid.konyakpivo.workers.dev";

const statusElement =
  document.getElementById("status");

const loginArea =
  document.getElementById("loginArea");

const accountArea =
  document.getElementById("accountArea");

const githubUser =
  document.getElementById("githubUser");

async function checkLogin() {

  try {

    const response = await fetch(
      WORKER_URL + "/api/me",
      {
        credentials: "include"
      }
    );

    if (!response.ok) {
      throw new Error("not logged in");
    }

    const data = await response.json();

    if (!data.authenticated) {
      throw new Error("not logged in");
    }

    statusElement.textContent =
      "Авторизация подтверждена.";

    githubUser.textContent =
      "@" + data.login;

    accountArea.style.display = "block";

  } catch (error) {

    statusElement.textContent =
      "Для доступа необходимо войти через GitHub.";

    loginArea.style.display = "block";

  }

}

document
  .getElementById("githubLogin")
  .addEventListener("click", function() {

    window.location.href =
      WORKER_URL + "/login";

  });

document
  .getElementById("logout")
  .addEventListener("click", async function() {

    await fetch(
      WORKER_URL + "/logout",
      {
        credentials: "include"
      }
    );

    location.reload();

  });

checkLogin();

</script>

</body>
</html>
